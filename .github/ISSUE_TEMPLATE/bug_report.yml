name: 🐛 Bug Report (P0 / P1 / P2)
description: Signaler un bug sur le parcours critique ou l'interface QALive
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Niveau de criticité
      options:
        - "P0 - Bloquant (Chemin critique cassé ou paiement non pris en compte -> Hotfix immédiat)"
        - "P1 - Majeur (Fonctionnalité dégradée -> À corriger jeudi)"
        - "P2 - Cosmétique / Mineur (Backlog)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Que s'est-il passé ?
      placeholder: Décrire le bug et la page concernée (/overview, /ask/:slug, /session/:slug...)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      value: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer l'erreur

